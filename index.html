<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Goo Treasure: Arcade Edition</title>
  <link rel="stylesheet" href="style.css">
  <link rel="apple-touch-icon" href="icon.png">
  <!-- Launch full-screen without Safari address/bottom bars -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Style the top status bar (battery/time) -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- App name under the Home Screen icon -->
  <meta name="apple-mobile-web-app-title" content="zGoo Arcade">
  <!-- Prevent accidental pinch-zooming while tapping game controls -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

</head>
<body>
  <div id="hud">
    <div class="stat">SCORE: <span id="scoreVal">0</span></div>
    <div class="stat">BEST: <span id="bestVal">0</span></div>
    <div class="stat">TIME: <span id="timeVal">90</span>s</div>
    <div class="stat">COMBO: <span id="comboVal" style="color:#00e5ff">1x</span></div>
    <div class="stat">LOST: <span id="escVal" style="color:#ff5577">0</span></div>
  </div>

  <div id="panel">
    <div class="head"><span>CONTROLS</span><button id="toggle">Hide</button></div>
    <div class="body">
      <div><div class="row"><span>Whittle Speed</span><span id="vWhit">1.2</span></div><input type="range" id="sWhit" min="0.3" max="3.0" step="0.1" value="1.2"></div>
      <div><div class="row"><span>Escape Speed</span><span id="vSpd">1.0</span></div><input type="range" id="sSpd" min="0.3" max="2.5" step="0.1" value="1.0"></div>
      <div><div class="row"><span>Push Force</span><span id="vPush">0.8</span></div><input type="range" id="sPush" min="0.0" max="2.5" step="0.1" value="0.8"></div>
      <div><div class="row"><span>Goo Blur</span><span id="vBlur">18</span></div><input type="range" id="sBlur" min="6" max="32" value="18"></div>
      <button id="muteBtn">Sound: ON</button>
      <button id="resetBtn">Restart Run</button>
    </div>
  </div>

  <div id="gameOver" class="hidden">
    <h1>TIME'S UP!</h1>
    <p>Final Score: <span id="finalScore">0</span></p>
    <p>High Score: <span id="finalBest">0</span></p>
    <button id="playAgainBtn">Play Again</button>
  </div>

  <div id="liquid"><canvas id="bCanvas"></canvas></div>
  <canvas id="cCanvas"></canvas>
  <div id="hint">SCRUB GOO TO FREE COINS &bull; CATCH CYAN +10s CLOCK COINS &bull; TAP PURPLE BAILEE 3X</div>

  <script src="game.js"></script>
</body>
</html>
